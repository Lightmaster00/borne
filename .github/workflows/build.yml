name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Build identity, compiled into the core and used by in-app updates:
#   tag vX.Y.Z -> version X.Y.Z (stable channel); otherwise <Cargo version>-dev.<run> (dev channel).
env:
  BORNE_BUILD: ${{ github.run_number }}
  # ScreenScraper developer credentials, compiled masked into the official builds (core/build.rs).
  # Repository secrets only: never in the code, masked in the logs, empty for forks' pull requests.
  BORNE_SS_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  BORNE_SS_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build identity
        shell: bash
        run: |
          base=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$base-dev.$GITHUB_RUN_NUMBER"; fi
          echo "BORNE_VERSION=$v" >> "$GITHUB_ENV"
          echo "BORNE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev qt6-l10n-tools libudev-dev libxcb-cursor0 libgl-dev libpulse0
      - name: Core tests
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Qt 6.8 to bundle (PySide6 wheels)
        run: |
          pip download --no-deps -d qt-wheels "pyside6-essentials==6.8.3" "pyside6-addons==6.8.3"
          mkdir -p qt-ess qt-add qt
          python3 -m zipfile -e qt-wheels/PySide6_Essentials-*.whl qt-ess
          python3 -m zipfile -e qt-wheels/PySide6_Addons-*.whl qt-add
          cp -a qt-ess/PySide6/Qt/. qt/ && cp -a qt-add/PySide6/Qt/. qt/
      - name: QML syntax
        run: scripts/check-qml.sh qt-ess/PySide6
      - name: Translations up to date and complete
        run: |
          chmod +x qt-ess/PySide6/lupdate
          LD_LIBRARY_PATH="$PWD/qt-ess/PySide6/Qt/lib" scripts/i18n/update.sh "$PWD/qt-ess/PySide6/lupdate"
          git diff --exit-code -- ui/i18n || { echo "ui/i18n is stale: run scripts/i18n/update.sh and commit"; exit 1; }
      - name: Package
        run: |
          LRELEASE=/usr/lib/qt6/bin/lrelease scripts/package.sh "$PWD/qt" "$PWD/out/Borne"
          tar czf Borne-linux-x86_64.tar.gz -C out Borne
      - name: Startup test
        run: scripts/smoke-test.sh out/Borne/bin/borne
      - name: Startup test (French)
        run: BORNE_LANG=fr scripts/smoke-test.sh out/Borne/bin/borne
      - name: In-app update test
        run: tests/update_test.sh out/Borne
      - uses: actions/upload-artifact@v4
        with:
          name: borne-linux-x86_64
          path: Borne-linux-x86_64.tar.gz

  macos:
    name: macOS Apple Silicon
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build identity
        shell: bash
        run: |
          base=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$base-dev.$GITHUB_RUN_NUMBER"; fi
          echo "BORNE_VERSION=$v" >> "$GITHUB_ENV"
          echo "BORNE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Official Qt 6.9 (works with the macOS 26 SDK)
        timeout-minutes: 20
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          modules: "qtmultimedia qtwebsockets"
          cache: true
      - name: Core tests
        run: cargo test --release --manifest-path core/Cargo.toml
      - name: Borne.app
        run: scripts/package-macos.sh "$PWD/out-macos"
      - name: Startup test
        run: scripts/smoke-test.sh "$PWD/out-macos/Borne.app/Contents/MacOS/borne"
      - uses: actions/upload-artifact@v4
        with:
          name: borne-macos-arm64
          path: out-macos/Borne-macos-*.zip

  # Publishes the builds for in-app updates:
  #   push on main -> pre-release "dev" (replaced each time); tag vX.Y.Z -> release vX.Y.Z (stable).
  # A manual run (workflow_dispatch) on main publishes the dev build too.
  publish:
    name: Publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build identity
        shell: bash
        run: |
          base=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$base-dev.$GITHUB_RUN_NUMBER"; fi
          echo "BORNE_VERSION=$v" >> "$GITHUB_ENV"
          echo "BORNE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes and update manifest
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"; CHANNEL=stable
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            git log --format='- %s' ${PREV:+$PREV..}"$TAG" > notes.md
          else
            TAG=dev; CHANNEL=dev
            git log -1 --format='%s' > notes.md
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          export TAG CHANNEL
          python3 - <<'PY'
          import hashlib, json, os
          tag, repo = os.environ["TAG"], os.environ["GITHUB_REPOSITORY"]
          url = f"https://github.com/{repo}/releases/download/{tag}/"
          assets = {}
          for key, name in (("linux-x86_64", "Borne-linux-x86_64.tar.gz"), ("macos-aarch64", "Borne-macos-arm64.zip")):
              data = open(f"dist/{name}", "rb").read()
              assets[key] = {"url": url + name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {"version": os.environ["BORNE_VERSION"], "build": int(os.environ["BORNE_BUILD"]),
                      "channel": os.environ["CHANNEL"], "commit": os.environ["BORNE_COMMIT"],
                      "date": __import__("datetime").date.today().isoformat(),
                      "notes": open("notes.md").read().strip(), "assets": assets}
          json.dump(manifest, open("dist/latest.json", "w"), indent=1)
          with open("dist/SHA256SUMS", "w") as f:
              for a in assets.values():
                  f.write(f"{a['sha256']}  {a['url'].rsplit('/', 1)[1]}\n")
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$CHANNEL" = dev ]; then
            gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --target "$GITHUB_SHA" \
              --title "Borne (development build)" --notes "Rebuilt on every change of main."
            # Move the dev tag to this commit, then replace the files.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit dev --notes "Build $BORNE_BUILD ($BORNE_VERSION, $BORNE_COMMIT): $(cat notes.md)"
            gh release upload dev dist/* --clobber
          else
            gh release create "$TAG" --title "Borne $BORNE_VERSION" --notes-file notes.md dist/*
          fi
