# Builds and publishes Borne.
#   push on main      → pre-release "dev" (replaced on each build; Settings → Updates → Development)
#   tag vX.Y.Z        → release vX.Y.Z (stable; the tag must match core/Cargo.toml's version)
#   manual run        → like a push on main
# Each release holds the full archives (first install), the package split in parts for in-app
# updates (only the changed parts are downloaded), latest.json (read by the updater) and SHA256SUMS.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ScreenScraper developer credentials, compiled masked into the official builds (core/build.rs).
  # Repository secrets only: never in the code, masked in the logs.
  BORNE_SS_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
  BORNE_SS_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux x86_64
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-identity
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ hashFiles('scripts/ci/linux-deps.sh') }}
          restore-keys: apt-${{ runner.os }}-
      - name: System packages
        timeout-minutes: 20
        run: scripts/ci/linux-deps.sh cmake g++ qt6-base-dev qt6-declarative-dev qt6-l10n-tools libudev-dev libxcb-cursor0 libgl-dev libpulse0
      - uses: ./.github/actions/qt-linux
      - name: Package
        run: LRELEASE=/usr/lib/qt6/bin/lrelease scripts/package.sh "$PWD/qt" "$PWD/out/Borne"
      - name: Startup test
        run: scripts/smoke-test.sh out/Borne/bin/borne
      - name: Startup test (French)
        run: BORNE_LANG=fr scripts/smoke-test.sh out/Borne/bin/borne
      - name: In-app update test (full archive, then by parts)
        run: tests/update_test.sh out/Borne
      - name: Archive and parts
        run: |
          mkdir -p dist
          tar czf dist/Borne-linux-x86_64.tar.gz -C out Borne
          # Part files carry the build number: a client reading the previous manifest during the upload
          # still finds that manifest's parts.
          scripts/release/parts.py out/Borne linux dist "Borne-linux-x86_64-$BORNE_BUILD" > dist/parts-linux-x86_64.json
          # The core computes the same part hashes as the script.
          python3 - <<'PY'
          import json, subprocess
          ours = {k: v["tree"] for k, v in json.load(open("dist/parts-linux-x86_64.json")).items()}
          core = json.loads(subprocess.run(["out/Borne/bin/borne", "--part-hashes", "out/Borne"], capture_output=True, text=True, check=True).stdout)
          assert ours == core, (ours, core)
          # A fresh install from the full archive has exactly these parts: its first update is by parts.
          import tarfile, tempfile
          d = tempfile.mkdtemp(); tarfile.open("dist/Borne-linux-x86_64.tar.gz").extractall(d)
          fresh = json.loads(subprocess.run(["out/Borne/bin/borne", "--part-hashes", d + "/Borne"], capture_output=True, text=True, check=True).stdout)
          assert ours == fresh, ("full archive differs from the parts", ours, fresh)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: borne-linux-x86_64
          path: dist/

  macos:
    name: macOS Apple Silicon
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-identity
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Qt 6.9 (official; works with the macOS 26 SDK)
        timeout-minutes: 20
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"
          modules: "qtmultimedia qtwebsockets qtquick3d qtshadertools"
          cache: true
      - name: Borne.app
        run: scripts/package-macos.sh "$PWD/out-macos"
      - name: Startup test
        run: scripts/smoke-test.sh "$PWD/out-macos/Borne.app/Contents/MacOS/borne"
      - name: Archive and parts
        run: |
          mkdir -p dist
          mv out-macos/Borne-macos-*.zip dist/Borne-macos-arm64.zip
          scripts/release/parts.py out-macos/Borne.app macos dist "Borne-macos-arm64-$BORNE_BUILD" > dist/parts-macos-arm64.json
          python3 - <<'PY'
          import json, subprocess
          ours = {k: v["tree"] for k, v in json.load(open("dist/parts-macos-arm64.json")).items()}
          core = json.loads(subprocess.run(["out-macos/Borne.app/Contents/MacOS/borne", "--part-hashes", "out-macos/Borne.app"], capture_output=True, text=True, check=True).stdout)
          assert ours == core, (ours, core)
          # A fresh install from the zip (as Finder unpacks it) has exactly these parts.
          import tempfile
          d = tempfile.mkdtemp(); subprocess.run(["ditto", "-x", "-k", "dist/Borne-macos-arm64.zip", d], check=True)
          fresh = json.loads(subprocess.run(["out-macos/Borne.app/Contents/MacOS/borne", "--part-hashes", d + "/Borne.app"], capture_output=True, text=True, check=True).stdout)
          assert ours == fresh, ("zip differs from the parts", ours, fresh)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: borne-macos-arm64
          path: dist/

  publish:
    name: Publish
    needs: [linux, macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-identity
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Manifest, checksums and notes
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"; CHANNEL=stable
            export PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          else
            TAG=dev; CHANNEL=dev
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          # The manifest clients have now: the notes say what updating from it downloads.
          PREV_TAG=$([ "$CHANNEL" = dev ] && echo dev || echo "${PREVIOUS_TAG:-}")
          if [ -n "$PREV_TAG" ] && curl -sfL -o previous.json "https://github.com/$GITHUB_REPOSITORY/releases/download/$PREV_TAG/latest.json"; then
            export PREVIOUS_MANIFEST=previous.json
          fi
          scripts/release/manifest.py dist "$TAG" "$CHANNEL"
          rm dist/parts-*.json
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$CHANNEL" = dev ]; then
            gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --target "$GITHUB_SHA" \
              --title "Borne (development build)" --notes "Rebuilt on every change of main."
            # The dev tag follows main; the files are replaced, stale ones removed.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            # New files first, the manifest last, stale files after: a client never reads a manifest
            # whose files are missing or not yet replaced.
            gh release upload dev $(ls dist/* | grep -v -e '/latest.json$' -e '/SHA256SUMS$') --clobber
            gh release upload dev dist/latest.json dist/SHA256SUMS --clobber
            for old in $(gh release view dev --json assets -q '.assets[].name'); do
              [ -e "dist/$old" ] || gh release delete-asset dev "$old" -y
            done
            gh release edit dev --title "Borne $BORNE_VERSION (development build)" --notes-file notes.md
          else
            gh release create "$TAG" --title "Borne $BORNE_VERSION" --notes-file notes.md --verify-tag dist/*
          fi
