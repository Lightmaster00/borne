[package]
name = "borne"
version = "0.1.0"
edition = "2021"
description = "Borne core: RomM, local library, downloads, profiles, local API"
license = "GPL-3.0-or-later"

[[bin]]
name = "borne"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
tiny_http = "0.12"
tungstenite = "0.30"
gilrs = "0.11"
dirs = "7"
rand = "0.10"
sha1_smol = "1"
sha2 = "0.11"
md-5 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
quick-xml = "0.42"
crc32fast = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Borne virtual mount (games played from RomM without a download). Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
