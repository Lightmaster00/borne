[package]
name = "borne"
version = "0.2.0"
edition = "2021"
description = "Borne core: RomM, local library, downloads, profiles, local API"
license = "GPL-3.0-or-later"

[[bin]]
name = "borne"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
tiny_http = "0.12"
tungstenite = "0.30"
gilrs = "0.11"
dirs = "7"
rand = "0.10"
sha1_smol = "1"
sha2 = "0.11"
md-5 = "0.11"
# Switch packages read before a game starts (their NCA headers, AES-XTS with the keys of the player).
aes = "0.8"
xts-mode = "0.5"
ctr = "0.9"
zstd = "0.13"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
quick-xml = "0.42"
crc32fast = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

# Free space, machine name and the game's process group (signals).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Borne virtual mount (games played from RomM without a download). Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
x11rb = { version = "0.13", features = ["res"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
